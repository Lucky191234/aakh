name: Nightly Refresh  # Aakh v1.1.0

on:
  schedule:
    - cron: "30 22 * * *"   # 4:00 AM IST (buffer for scheduler delays -> ~4:30 AM)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch GitHub trending repos
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/fetch_github_trending.py

      - name: Fetch competitions
        run: python scripts/fetch_competitions.py

      - name: Fetch Hacker News RSS
        run: python scripts/fetch_hackernews_rss.py

      - name: Fetch word of the day
        run: python scripts/fetch_word_of_day.py

      - name: Rank hot topics with LLM
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/rank_hot_topics.py

      - name: Build final dashboard data
        run: python scripts/build_dashboard_data.py

      - name: Generate morning audio (4 voices)
        run: python scripts/generate_audio.py

      - name: Copy data and audio into docs for GitHub Pages
        run: |
          mkdir -p docs/data docs/audio
          cp data/data.json docs/data/data.json

      - name: Commit updated data
        run: |
          git config user.name "aakh-bot"
          git config user.email "aakh-bot@users.noreply.github.com"
          git add data/ docs/data/ docs/audio/ || true
          git diff --cached --quiet || git commit -m "chore: nightly refresh $(date -u +'%Y-%m-%d')"
          git push

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Aakh nightly refresh FAILED -- $(date -u +'%Y-%m-%d')"
          echo "::error::Visit https://github.com/${{ github.repository }}/actions"
